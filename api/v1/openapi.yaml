openapi: 3.1.0
info:
  title: Open Government Schemes API (proposed)
  version: 1.0.0-poc
  summary: Machine-readable, source-traceable government scheme and eligibility data.
  description: |
    **Proposal** for an official, read-only API publishing Central and State/UT
    welfare schemes as structured, versioned, evidence-linked records.

    The Mera Haq proof of concept serves this exact contract as static files
    under `/api/v1/` (generated by `scripts/build-api.mjs` from
    `data/schemes.json`). Pointing the POC at an official base URL is a
    one-line configuration change (`<meta name="merahaq-api-base">`).

    Design principles:
    1. **No personal data.** The API publishes rules, not people. Eligibility
       is evaluated on the citizen's device with the open reference engine
       (`src/engine/eligibility.js`). For privacy, there is deliberately no
       server-side "evaluate my profile" endpoint.
    2. **Traceability.** Every criterion, benefit and document carries
       `evidence` (source index + verbatim quote) pointing to an official
       document or Government Resolution.
    3. **Explicit unknowns.** Unknown values are `null`, never guessed.
    4. **Versioned.** Records carry `version`, and `/changes` is an
       incremental change feed so consumers (UMANG, State portals, CSCs,
       NGOs) can stay in sync without scraping.
  license:
    name: Government Open Data License - India (GODL) (proposed)
    url: https://data.gov.in/government-open-data-license-india
  contact:
    name: Mera Haq POC
    url: https://github.com/devneeraj15/Mera-Haq
servers:
  - url: https://devneeraj15.github.io/Mera-Haq/api/v1
    description: POC (static files, same contract)
  - url: https://{publisher}/schemes/v1
    description: Proposed official deployment (e.g. myScheme / API Setu / UMANG)
    variables:
      publisher:
        default: api.example.gov.in
tags:
  - name: Schemes
  - name: Jurisdictions
  - name: Sync
paths:
  /meta.json:
    get:
      tags: [Sync]
      summary: Dataset metadata
      operationId: getMeta
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
  /schemes/index.json:
    get:
      tags: [Schemes]
      summary: All published schemes (eligibility-ready records)
      description: |
        In the official API this would be `GET /schemes` with query filters
        (`level`, `jurisdiction`, `category`, `status`, `updatedSince`,
        `page`, `pageSize`). The static POC serves the full collection.
      operationId: listSchemes
      parameters:
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: jurisdiction, in: query, schema: { $ref: "#/components/schemas/JurisdictionCode" } }
        - { name: category, in: query, schema: { type: string } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Scheme collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemeCollection" }
  /schemes/{id}.json:
    get:
      tags: [Schemes]
      summary: One scheme with criteria, evidence and sources
      operationId: getScheme
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,120}$" }
      responses:
        "200":
          description: Scheme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scheme" }
        "404": { description: Unknown scheme id }
  /jurisdictions/index.json:
    get:
      tags: [Jurisdictions]
      summary: The 28 States and 8 Union Territories
      operationId: listJurisdictions
      responses:
        "200":
          description: Jurisdictions with scheme counts
          content:
            application/json:
              schema:
                type: object
                required: [jurisdictions]
                properties:
                  jurisdictions:
                    type: array
                    items: { $ref: "#/components/schemas/Jurisdiction" }
  /jurisdictions/{code}/schemes.json:
    get:
      tags: [Jurisdictions]
      summary: Schemes applicable in a State/UT (Central + that State/UT)
      operationId: listSchemesForJurisdiction
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: "#/components/schemas/JurisdictionCode" }
      responses:
        "200":
          description: Applicable schemes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemeCollection" }
  /changes/index.json:
    get:
      tags: [Sync]
      summary: Change feed (added / changed fields / retired)
      description: Official API would accept `?since=<timestamp>`.
      operationId: listChanges
      responses:
        "200":
          description: Change events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/ChangeEvent" }
components:
  schemas:
    Level: { type: string, enum: [CENTRAL, STATE, UNION_TERRITORY] }
    JurisdictionCode:
      type: string
      description: ISO 3166-2:IN subdivision suffix, or ALL for Central schemes
      enum: [ALL, AP, AR, AS, BR, CT, GA, GJ, HR, HP, JH, KA, KL, MP, MH, MN, ML, MZ, NL, OR, PB, RJ, SK, TN, TG, TR, UP, UK, WB, AN, CH, DH, DL, JK, LA, LD, PY]
    VerificationStatus: { type: string, enum: [VERIFIED, PARTIALLY_VERIFIED, NEEDS_REVIEW, OUTDATED, INACTIVE, SOURCE_UNAVAILABLE] }
    Meta:
      type: object
      required: [apiVersion, schemaVersion, generatedAt, count, publisher, notice]
      properties:
        apiVersion: { type: string }
        schemaVersion: { type: integer }
        generatedAt: { type: string, format: date-time }
        count: { type: integer }
        publisher: { type: string }
        notice: { type: string }
        coverage:
          type: object
          additionalProperties: { type: integer }
    Jurisdiction:
      type: object
      required: [code, name, type, schemeCount]
      properties:
        code: { $ref: "#/components/schemas/JurisdictionCode" }
        name: { type: string }
        type: { type: string, enum: [STATE, UNION_TERRITORY] }
        schemeCount: { type: integer, description: State/UT-specific schemes (excludes Central) }
    SchemeCollection:
      type: object
      required: [count, schemes]
      properties:
        count: { type: integer }
        generatedAt: { type: string, format: date-time }
        schemes:
          type: array
          items: { $ref: "#/components/schemas/Scheme" }
    Evidence:
      type: object
      required: [source, quote]
      properties:
        source: { type: integer, description: Index into the scheme's sources array }
        quote: { type: string, description: Verbatim sentence from the official source }
        verified: { type: boolean, description: Quote found in the latest source capture }
    Criterion:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        field:
          type: string
          enum: [age, gender, state, domicileState, annualFamilyIncome, socialCategory, religion, disability, disabilityPercent, educationLevel, studentLevel, employmentStatus, occupation, residence, maritalStatus, isIncomeTaxPayer]
        op: { type: string, enum: [gte, lte, gt, lt, eq, in, notIn, isTrue, isFalse, eduGte, manual] }
        value: {}
        anyOf:
          type: array
          items: { $ref: "#/components/schemas/Criterion" }
        mandatory: { type: boolean, default: true }
        gate: { type: boolean, description: Broad precondition (e.g. currently studying). Passing it alone is not evidence of eligibility }
        evidence: { $ref: "#/components/schemas/Evidence" }
    Source:
      type: object
      required: [title, publisher, url, documentType]
      properties:
        title: { type: string }
        publisher: { type: string }
        url: { type: string, format: uri }
        documentType: { type: string, enum: [OFFICIAL_SCHEME_PAGE, GOVERNMENT_GUIDELINE, GAZETTE_NOTIFICATION, GOVERNMENT_RESOLUTION, OFFICIAL_APPLICATION_PORTAL, OFFICIAL_DEPARTMENT_CIRCULAR] }
        publicationDate: { type: [string, "null"], format: date }
        retrievedAt: { type: [string, "null"], format: date-time }
        contentSha256: { type: [string, "null"] }
    Scheme:
      type: object
      required: [id, name, level, jurisdictions, category, criteria, benefits, documents, sources, verification, version]
      properties:
        id: { type: string }
        name: { type: string }
        altNames: { type: array, items: { type: string } }
        summary: { type: [string, "null"], maxLength: 140, description: One-line plain-language paraphrase of quoted benefits and criteria }
        description: { type: [string, "null"] }
        category: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        jurisdictions: { type: array, items: { $ref: "#/components/schemas/JurisdictionCode" } }
        ministry: { type: [string, "null"] }
        department: { type: [string, "null"] }
        criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
        benefits:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              amount: { type: [number, "null"], minimum: 0 }
              frequency: { type: [string, "null"] }
              evidence: { $ref: "#/components/schemas/Evidence" }
        documents:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              evidence: { $ref: "#/components/schemas/Evidence" }
        applicationUrl: { type: [string, "null"], format: uri }
        infoUrl: { type: [string, "null"], format: uri }
        applicationWindow:
          type: [object, "null"]
          properties:
            opens: { type: [string, "null"], format: date }
            closes: { type: [string, "null"], format: date }
        status: { type: string, enum: [ACTIVE, INACTIVE, UNKNOWN] }
        sources: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Source" } }
        verification:
          type: object
          required: [status]
          properties:
            status: { $ref: "#/components/schemas/VerificationStatus" }
            checkedAt: { type: string, format: date-time }
            quotesTotal: { type: integer }
            quotesFound: { type: integer }
        version: { type: integer, minimum: 1 }
    ChangeEvent:
      type: object
      required: [syncedAt, added, changed]
      properties:
        syncedAt: { type: string, format: date-time }
        added: { type: array, items: { type: string } }
        changed:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        keptPrevious: { type: array, items: { type: object } }
        missingFromLatestRun: { type: array, items: { type: string } }
